# Wasmer Edge Deployment Configuration for Tolk by Lunola
# Dokumentasi: https://docs.wasmer.io/edge
# Jalankan: npm run build:wasmer && wasmer deploy --publish-package

[package]
name = "pujosety/tolk-by-lunola"
version = "1.0.53"
description = "Tolk by Lunola — Aplikasi komunikasi lintas platform real-time berbasis Web, PWA & Android WebView di Wasmer Edge"
entrypoint = "run"

[dependencies]
"wasmer/edgejs" = "^0.2"

[fs]
"/app/dist" = "./dist"
"/app/dist-server" = "./dist-server"
"/app/data" = "./data"
"/app/uploads" = "./uploads"

[[command]]
name = "run"
module = "wasmer/edgejs:edge"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/dist-server/server.mjs"]
env = [
  "NODE_ENV=production",
  "PORT=3000",
  "WASMER_RUNTIME=edge"
]

[command.annotations.wasmer]
http = { port = 3000, websockets = true }
